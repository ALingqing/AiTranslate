name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Sync version from tag
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: AiTranslate ${{ github.ref_name }}
          generate_release_notes: true
          files: target/*.jar
